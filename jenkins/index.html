<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elegant Invitation</title>
    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: #fdf6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #fff;
            border: 2px solid #e8cfc1;
            padding: 40px;
            width: 450px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 36px;
            color: #b76e79;
            margin-bottom: 10px;
        }
        .divider {
            width: 60px;
            height: 2px;
            background: #b76e79;
            margin: 20px auto;
        }
        p {
            font-size: 18px;
            color: #444;
            margin: 8px 0;
        }
        .highlight {
            font-size: 22px;
            color: #8b4a56;
            margin: 15px 0;
        }
        .footer {
            margin-top: 25px;
            font-style: italic;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Invitation</h1>
        <div class="divider"></div>

        <p>You are cordially invited to</p>
        <p class="highlight">A Special Celebration</p>

        <p><strong>Date:</strong> May 10, 2026</p>
        <p><strong>Time:</strong> 5:00 PM</p>
        <p><strong>Venue:</strong> Garden Venue, Your City</p>

        <div class="divider"></div>

        <p class="footer">With love & warm wishes</p>
    </div>

</body>
</html>
