<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invitation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h1 {
            color: #e67e22;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        .footer {
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>You're Invited!</h1>
        <p>Join us to celebrate</p>
        <h2>🎉 Special Event 🎉</h2>
        
        <p><strong>Date:</strong> 25th March 2026</p>
        <p><strong>Time:</strong> 6:00 PM</p>
        <p><strong>Venue:</strong> Your Location Here</p>

        <p class="footer">We look forward to seeing you!</p>
    </div>

</body>
</html>
