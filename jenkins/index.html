<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Invitation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 32px;
            color: #6a11cb;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 22px;
            color: #2575fc;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            color: #444;
            margin: 8px 0;
        }

        .details {
            margin: 20px 0;
        }

        .highlight {
            font-weight: bold;
            color: #333;
        }

        .btn {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff6a00, #ee0979);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>You're Invited 🎉</h1>
        <h2>Grand Celebration Event</h2>

        <p>We are delighted to invite you to celebrate this special occasion with us.</p>

        <div class="details">
            <p><span class="highlight">Date:</span> June 15, 2026</p>
            <p><span class="highlight">Time:</span> 6:30 PM</p>
            <p><span class="highlight">Venue:</span> Royal Banquet Hall</p>
        </div>

        <p>Your presence will make our event more special.</p>

        <button class="btn" onclick="showMessage()">RSVP</button>

        <footer>
            With love & regards ❤️
        </footer>
    </div>

    <script>
        function showMessage() {
            alert("Thank you! We look forward to seeing you!");
        }
    </script>

</body>
</html>
